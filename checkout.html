<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SinoHerb | Checkout</title>
    <meta name="description" content="SinoHerb 结算页示意。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="checkout-page">
    <div class="checkout-shell">
      <header class="site-header">
        <a class="brand" href="./index.html" aria-label="返回首页">
          <span class="brand-mark">S</span>
          <span class="brand-copy">
            <strong>SinoHerb</strong>
            <span>Checkout</span>
          </span>
        </a>
        <a class="button button--ghost" href="./index.html#products">返回继续浏览</a>
      </header>

      <section class="checkout-hero">
        <span class="eyebrow">结算页 / checkout</span>
        <h1>确认你的方案，再完成下单。</h1>
        <p class="lead">
          这里是静态结算示意，后续可以接支付、物流与账号系统。现在先把购买路径跑通。
        </p>
      </section>

      <div class="checkout-layout">
        <form class="checkout-form">
          <div>
            <span class="eyebrow">Shipping</span>
            <h2>配送信息</h2>
          </div>

          <div class="checkout-grid">
            <label class="checkout-field">
              <span>First name</span>
              <input type="text" placeholder="Alex" />
            </label>
            <label class="checkout-field">
              <span>Last name</span>
              <input type="text" placeholder="Wong" />
            </label>
            <label class="checkout-field">
              <span>Email</span>
              <input type="email" placeholder="alex@example.com" />
            </label>
            <label class="checkout-field">
              <span>Country / Region</span>
              <select>
                <option>United States</option>
                <option>United Kingdom</option>
                <option>Canada</option>
                <option>Australia</option>
              </select>
            </label>
          </div>

          <label class="checkout-field">
            <span>Address</span>
            <input type="text" placeholder="Street address" />
          </label>

          <div class="checkout-grid">
            <label class="checkout-field">
              <span>City</span>
              <input type="text" placeholder="Los Angeles" />
            </label>
            <label class="checkout-field">
              <span>Postal code</span>
              <input type="text" placeholder="90001" />
            </label>
          </div>

          <label class="checkout-field">
            <span>Notes</span>
            <textarea placeholder="Any delivery notes or health considerations..."></textarea>
          </label>

          <button class="button button--primary" type="button">Place order</button>
        </form>

        <aside class="checkout-summary">
          <div>
            <span class="eyebrow">Order summary</span>
            <h2>你的购物车</h2>
          </div>

          <div class="checkout-summary__items">
            <article class="checkout-summary__item">
              <div class="checkout-summary__line">
                <strong>Calm Tea Blend</strong>
                <span>$24</span>
              </div>
              <p>饮食产品 · 肝郁焦虑体质</p>
            </article>
            <article class="checkout-summary__item">
              <div class="checkout-summary__line">
                <strong>Night Foot Soak</strong>
                <span>$32</span>
              </div>
              <p>泡脚产品 · 失眠多梦体质</p>
            </article>
            <article class="checkout-summary__item">
              <div class="checkout-summary__line">
                <strong>Experience Pass</strong>
                <span>$18</span>
              </div>
              <p>体验类产品 · 气机淤堵体质</p>
            </article>
          </div>

          <div class="checkout-summary__line">
            <span>Subtotal</span>
            <strong>$74</strong>
          </div>

          <p class="lead">后续可在这里接入真实支付、税费、物流和订单状态。</p>
        </aside>
      </div>
    </div>
  </body>
</html>
