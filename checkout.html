<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SinoHerb | Checkout</title>
    <meta name="description" content="SinoHerb 结算页示意。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="checkout-page">
    <div class="checkout-shell">
      <div class="announcement">
        <p>先聊体质，再推荐产品 · 目前使用本地对话规则，后续可接入大模型</p>
        <a href="./my-constitution.html">开始对话</a>
      </div>

      <header class="site-header">
        <a class="brand" href="./index.html" aria-label="返回首页">
          <span class="brand-mark">S</span>
          <span class="brand-copy">
            <strong>SinoHerb</strong>
            <span>TCM wellness for overseas users</span>
          </span>
        </a>

        <nav class="site-nav" aria-label="主导航">
          <a href="./index.html">首页</a>
          <a href="./products.html">产品</a>
          <a href="./philosophy.html">理念</a>
          <a href="./my-constitution.html">我的体质</a>
          <a href="./about.html">关于我们</a>
          <a class="cart-button is-active" href="./cart.html" aria-current="page">
            <span>Cart</span>
            <span class="cart-button__badge">3</span>
          </a>
        </nav>
      </header>

      <section class="checkout-hero">
        <span class="eyebrow">结算页 / checkout</span>
        <h1>确认你的方案，再完成下单。</h1>
        <p class="lead">
          提交订单后，我们会人工联系你确认付款与配送。
        </p>
      </section>

      <div class="checkout-layout">
          <form class="checkout-form" id="checkoutForm">
          <div>
            <span class="eyebrow">Shipping</span>
            <h2>配送信息</h2>
          </div>

          <div class="checkout-grid">
            <label class="checkout-field">
              <span>First name</span>
              <input type="text" name="firstName" placeholder="Alex" required />
            </label>
            <label class="checkout-field">
              <span>Last name</span>
              <input type="text" name="lastName" placeholder="Wong" required />
            </label>
            <label class="checkout-field">
              <span>Email</span>
              <input type="email" name="email" placeholder="alex@example.com" />
            </label>
            <label class="checkout-field">
              <span>Country / Region</span>
              <select>
                <option>United States</option>
                <option>United Kingdom</option>
                <option>Canada</option>
                <option>Australia</option>
              </select>
            </label>
            <label class="checkout-field">
              <span>Phone</span>
              <input type="tel" name="phone" placeholder="+1 555 000 0000" required />
            </label>
          </div>

          <label class="checkout-field">
            <span>Address</span>
              <input type="text" name="address" placeholder="Street address" required />
          </label>

          <div class="checkout-grid">
            <label class="checkout-field">
              <span>City</span>
              <input type="text" placeholder="Los Angeles" />
            </label>
            <label class="checkout-field">
              <span>Postal code</span>
              <input type="text" placeholder="90001" />
            </label>
          </div>

          <label class="checkout-field">
            <span>Notes</span>
              <textarea name="notes" placeholder="Any delivery notes or health considerations..."></textarea>
          </label>

          <button class="button button--primary" type="submit">提交待联系订单</button>
          <p id="checkoutMessage" role="status"></p>
        </form>

        <aside class="checkout-summary">
          <div>
            <span class="eyebrow">Order summary</span>
            <h2>你的购物车</h2>
          </div>

          <div class="checkout-summary__items" id="checkoutItems"><p>正在加载购物车…</p></div>

          <div class="checkout-summary__line" id="checkoutTotal">
            <span>Subtotal</span>
            <strong>$0.00</strong>
          </div>

          <p class="lead">首期订单提交后由工作人员联系确认，不在线收款。</p>
        </aside>
      </div>
    </div>
    <script src="./frontend-api.js"></script>
  </body>
</html>
